services:
  - type: web
    name: adjustglow-support-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: BUSINESS_NAME
        value: Lumen Cycles
